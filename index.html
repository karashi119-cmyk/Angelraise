<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天使を育てることになりました｜少女育成ゲーム公式サイト</title>
    <meta name="description" content="少女育成シミュレーションゲーム『天使を育てることになりました』の公式サイトです。">

    <style>
        /* 1. 背景をしっかり表示させる */
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh; /* 画面の一番下まで背景色を塗る */
           <img src="img/background.png" class="background" >
            background-size: cover;
            text-align: center;
        }

        #top {
            padding: 20px 10px;
        }

        .header {
            width: 100%;
            max-width: 500px;
            height: auto;
            margin-bottom: 20px;
        }

        /* 2. ボタンを2列ずつ並べる（魔法のコード） */
        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 1対1の比率で2列にする */
            gap: 15px; /* ボタン同士の隙間 */
            max-width: 400px; /* メニュー全体の最大幅 */
            margin: 0 auto; /* 中央寄せ */
            padding: 0 10px;
        }

        .btn {
            width: 100%; /* 列の幅いっぱいに広げる */
            height: auto;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:active {
            transform: scale(0.95); /* 押した時に少しへこむ演出 */
        }

        /* 3. カウンターの窓を整える */
        .counter-window {
            position: relative;
            width: 280px;
            margin: 40px auto;
        }
        .window-bg {
            width: 100%;
            height: auto;
            display: block;
        }
        .window-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            color: #333;
            font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
            font-weight: bold;
        }
        .counter-text { margin: 0; font-size: 13px; letter-spacing: 1px; }
        .counter-line { margin: 3px 0; min-height: 30px; display: flex; justify-content: center; align-items: center; }
    </style>
</head>

<body>
  <div id="top">
    <img src="img/toppage.png" class="header">
    
    <div class="menu">
      <img src="img/Introduction.png" class="btn" onclick="showIntro()">
      <img src="img/GAME.png" class="btn" onclick="openComing()">
      <img src="img/Blog.png" class="btn" onclick="showBlog()">
      <img src="img/PROFILE.png" class="btn" onclick="openProfile()">
    </div>

    <div class="counter-window">
      <img src="img/window.png" class="window-bg">
      <div class="window-content">
        <p class="counter-text">あなたは</p>
        <div class="counter-line">
          <script language="javascript" type="text/javascript" src="//counter1.fc2.com/counter.php?id=41003714&main=1"></script>
        </div>
        <p class="counter-text">人目の迷い子です</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
