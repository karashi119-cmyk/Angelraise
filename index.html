<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Angelraise</title>
  
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <style>
    /* --- 基本設定 --- */
    body, html {
      margin: 0; padding: 0; min-height: 100vh;
      font-family: 'DotGothic16', sans-serif;
      text-align: center;
      color: white;
      /* 背景画像を固定して表示 */
      background: #9253c8 url('img/background.png') no-repeat center center fixed;
      background-size: cover;
    }

    #top, #intro, #blog {
      padding: 20px 10px;
      box-sizing: border-box;
    }

    /* --- タイトル画像 --- */
    .header {
      width: 100%;
      max-width: 500px;
      height: auto;
      margin-bottom: 20px;
    }

    /* --- ボタンを2列に並べる --- */
    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 2列 */
      gap: 15px; /* ボタン同士の隙間 */
      max-width: 360px;
      margin: 0 auto 30px auto;
    }

    .btn {
      width: 100%;
      height: auto;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.95); }

    /* --- カウンターウィンドウ --- */
    .counter-window {
      position: relative;
      width: 260px;
      margin: 0 auto;
    }
    .window-bg { width: 100%; height: auto; display: block; }
    .window-content {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 100%; color: #333;
    }
    .counter-text { margin: 0; font-size: 13px; font-weight: bold; }
    .counter-line { margin: 2px 0; min-height: 30px; display: flex; justify-content: center; align-items: center; }

    /* --- ポップアップ --- */
    .popup {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none; justify-content: center; align-items: center;
      z-index: 1000;
    }
    .popup-image-container { position: relative; width: 90%; max-width: 400px; }
    .close-button {
      position: absolute; top: -40px; right: 0;
      font-size: 40px; color: white; cursor: pointer;
    }
    .profile-popup-img, .coming-popup-img, .intro-img, .diary-img {
      width: 100%; height: auto;
    }

    /* --- SNSリンク --- */
    .sns-links {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .sns-icon { width: 40px; height: auto; }

    .top-btn { margin-top: 20px; padding: 10px 20px; font-family: 'DotGothic16'; }
  </style>
</head>
<body>

  <div id="top">
    <img src="img/toppage.png" class="header">
    
    <div class="menu">
      <img src="img/Introduction.png" class="btn" onclick="showIntro()">
      <img src="img/GAME.png" class="btn" onclick="openComing()">
      <img src="img/Blog.png" class="btn" onclick="showBlog()">
      <img src="img/PROFILE.png" class="btn" onclick="openProfile()">
    </div>

    <div class="counter-window">
      <img src="img/window.png" class="window-bg">
      <div class="window-content">
        <p class="counter-text">あなたは</p>
        <div class="counter-line">
          <script language="javascript" src="//counter1.fc2.com/counter.php?id=41003714&main=1"></script>
        </div>
        <p class="counter-text">人目の迷い子です</p>
      </div>
    </div>
  </div>

  <div id="intro" style="display:none;">
    <img src="img/INTRO.png" class="intro-img">
    <br>
    <button class="top-btn" onclick="backToTop()">TOP</button>
  </div>

  <div id="blog" style="display:none;">
    <div class="diary-container">
      <img id="diaryImage" src="img/diary1.png" class="diary-img">
      <div class="page-buttons-overlay">
        <button onclick="prevDiary()">BACK</button>
        <button onclick="nextDiary()">NEXT</button>
      </div>
    </div>
    <button class="top-btn" onclick="backToTop()">TOP</button>
  </div>

  <div id="profilePopup" class="popup" onclick="closeProfile()">
    <div class="popup-image-container" onclick="event.stopPropagation()">
      <div class="close-button" onclick="closeProfile()">×</div>
      <img src="img/pinkprofile.png" class="profile-popup-img">
      <div class="sns-links">
        <a href="https://x.com/n_nekomata?s=21&t=UNfIEowMXanUYBRbJpNHYw" target="_blank"><img src="img/x.png" class="sns-icon"></a>
        <a href="https://www.instagram.com/n.nekomata?igsh=MXF2ZXNubWJwZXZ2eg%3D%3D&utm_source=qr" target="_blank"><img src="img/insta.png" class="sns-icon"></a>
        <a href="https://www.tiktok.com/@n_nekomata3?_r=1&_t=ZS-96HVj8DwZeP" target="_blank"><img src="img/tiktok.png" class="sns-icon"></a>
      </div>
    </div>
  </div>

  <div id="comingPopup" class="popup" onclick="closeComing()">
    <div class="popup-image-container" onclick="event.stopPropagation()">
      <div class="close-button" onclick="closeComing()">×</div>
      <img src="img/comingsoon.png" class="coming-popup-img">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
