<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Angelraise</title>
  <style>
    /* --- 全体リセット --- */
    body, html {
      margin: 0; padding: 0;
      width: 100%; min-height: 100vh;
      background: #9253c8 url('img/background.png') no-repeat center top fixed;
      background-size: cover;
      overflow-x: hidden; /* 横揺れ防止 */
    }

    /* --- TOP画面のレイアウトを固定 --- */
    #top {
      display: block; /* 最初は表示 */
      width: 100%;
      text-align: center;
      padding-top: 20px;
    }

    .header {
      width: 90%; max-width: 500px;
      height: auto;
      margin: 0 auto 10px auto;
    }

    /* ボタン2列を安定させる */
    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 85%; max-width: 350px;
      margin: 10px auto 30px auto;
    }

    .btn { width: 100%; height: auto; cursor: pointer; }

    /* --- 日記画面（全画面） --- */
    #blog {
      display: none;
      width: 100%; min-height: 100vh;
      background-color: #000; /* 日記中は背景を黒くして没入感を出す */
    }

    .diary-wrapper {
      position: relative;
      width: 100%;
      line-height: 0; /* 画像の下の隙間を消す */
    }

    #diaryImage {
      width: 100%; height: auto;
      display: block;
    }

    /* 矢印ボタン */
    .arrow {
      position: absolute; bottom: 10%; width: 15%; max-width: 70px;
      opacity: 0.6; z-index: 10;
    }

    /* --- TOPに戻るボタンのデザイン --- */
    .back-btn-container { padding: 30px 0; text-align: center; }
    .back-to-top-style {
      display: inline-block;
      padding: 12px 30px;
      background: white; color: #9253c8;
      border: 4px solid #9253c8; border-radius: 8px;
      font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="top">
    <img src="img/toppage.png" class="header">
    <div class="menu">
      <img src="img/Introduction.png" class="btn" onclick="showIntro()">
      <img src="img/GAME.png" class="btn" onclick="openComing()">
      <img src="img/Blog.png" class="btn" onclick="showBlog()">
      <img src="img/PROFILE.png" class="btn" onclick="openProfile()">
    </div>
    </div>

  <div id="blog">
    <div class="diary-wrapper">
      <img id="diaryImage" src="img/diary1.png">
      <img src="img/BACK.png" class="arrow" style="left: 5%;">
      <img src="img/NEXT.png" class="arrow" style="right: 5%;">
    </div>
    <div class="back-btn-container">
      <div class="back-to-top-style" onclick="backToTop()">◀ TOPに戻る</div>
    </div>
  </div>

  <div class="counter-window" style="position: relative; width: 280px; margin: 20px auto;">
  <img src="img/window.png" class="window-bg" style="width: 100%; height: auto; display: block;">

  <div class="window-content" style="
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    color: #333;
    font-family: 'DotGothic16', sans-serif;
  ">
    <p style="margin: 0; font-size: 13px; font-weight: bold;">あなたは</p>
    
    <div class="counter-line" style="margin: 5px 0; min-height: 32px; display: flex; justify-content: center; align-items: center;">
      <script language="javascript" type="text/javascript" src="//counter1.fc2.com/counter.php?id=41003714&main=1"></script>
    </div>
    
    <p style="margin: 0; font-size: 13px; font-weight: bold;">人目の迷い子です</p>
  </div>
</div>


  <script>
    function backToTop() {
      // 1. 全画面を確実に隠す
      document.getElementById("blog").style.display = "none";
      if(document.getElementById("intro")) document.getElementById("intro").style.display = "none";
      
      // 2. TOPを「block」で表示（これが崩れ防止に重要）
      const top = document.getElementById("top");
      top.style.display = "block";
      
      // 3. 画面サイズを再認識させるため、少しだけスクロールを戻す
      window.scrollTo(0, 0);
    }

    function showBlog() {
      document.getElementById("top").style.display = "none";
      document.getElementById("blog").style.display = "block";
      window.scrollTo(0, 0);
    }

    // 他の showIntro などの関数も同様に「まず全部消してから一つ出す」書き方にしてください
  </script>
</body>
</html>
