<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>天使を育てることになりました。</title>
  <meta name="description" content="少女を育成するシミュレーションゲーム">

  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <style>
    /* 1. 画面全体の余白を完全にゼロにする */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background-color: #9253c8;
      font-family: 'DotGothic16', sans-serif;
      overflow-x: hidden; /* 横揺れ防止 */
    }

    /* 2. 背景画像を画面幅100%で配置（基準を作る） */
    .site-wrapper {
      position: relative;
      width: 100%;
      line-height: 0; /* 画像の下にできる謎の隙間を消す */
    }

    /* 背景画像そのもの */
    .bg-base {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 3. 背景画像の上にコンテンツを重ねる */
    .content-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: normal; /* 文字の行間を元に戻す */
      padding-top: 5%; /* 画面サイズに合わせた上の余白 */
    }

    /* --- 各パーツのサイズ調整 --- */
    .header {
      width: 85%; /* タイトルロゴの幅 */
      max-width: 600px;
      height: auto;
      margin-bottom: 5%;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 80%; /* メニューの全体幅 */
      max-width: 400px;
      margin-bottom: 8%;
    }
    .btn { width: 100%; height: auto; cursor: pointer; }

    /* カウンター窓 */
    .counter-window {
      position: relative;
      width: 70%; /* 画面幅に合わせる */
      max-width: 300px;
    }
    .window-bg { width: 100%; height: auto; }
    .window-content {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      color: #333;
      text-align: center;
    }

    /* BLOG画面などのポップアップ */
    #blog {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 100; display: none; overflow-y: auto;
    }
    .diary-wrapper { width: 100%; margin: 0 auto; }
    #diaryImage { width: 100%; height: auto; }
  </style>
</head>
<body>

  <div class="site-wrapper">
    
    <img src="img/background.png" class="bg-base">

    <div class="content-overlay" id="top">
      
      <img src="img/toppage.png" class="header">
      
      <div class="menu">
        <img src="img/Introduction.png" class="btn" onclick="showIntro()">
        <img src="img/GAME.png" class="btn" onclick="openComing()">
        <img src="img/Blog.png" class="btn" onclick="showBlog()">
        <img src="img/PROFILE.png" class="btn" onclick="openProfile()">
      </div>

      <div class="counter-window">
        <img src="img/window.png" class="window-bg">
        <div class="window-content">
          <p style="margin: 0; font-size: min(3.5vw, 14px); font-weight: bold;">あなたは</p>
          <div style="margin: 3% 0;">
            <script language="javascript" src="//counter1.fc2.com/counter.php?id=41003714&main=1"></script>
          </div>
          <p style="margin: 0; font-size: min(3.5vw, 14px); font-weight: bold;">人目の迷い子です</p>
        </div>
      </div>

    </div>
  </div>

  <div id="blog">
    <div class="diary-wrapper">
      <img id="diaryImage" src="img/diary1.png">
      <div style="text-align: center; padding: 20px;">
        <button onclick="backToTop()" style="padding: 10px 20px; font-family: 'DotGothic16';">TOPへ戻る</button>
      </div>
    </div>
  </div>

  <script>
    function showBlog() { document.getElementById("blog").style.display = "block"; }
    function backToTop() { document.getElementById("blog").style.display = "none"; }
    function openProfile() { /* 以前のポップアップコードをここに入れてください */ }
    function openComing() { alert("Coming Soon..."); }
    function showIntro() { alert("Introduction..."); }
  </script>

</body>
</html>
