<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>天使を育てることになりました。</title>
  <meta name="description" content="少女を育成するシミュレーションゲーム">

  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <style>
    /* 1. 全体の余白を完全にゼロにする */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background-color: #9253c8;
      font-family: 'DotGothic16', sans-serif;
      overflow-x: hidden;
    }

    /* 2. 背景画像を画面幅100%にする（基準枠） */
    .site-wrapper {
      position: relative;
      width: 100%; /* ここを100%に */
      margin: 0;   /* 余白なし */
      line-height: 0; 
    }

    /* 背景画像：画面の端から端まで広げる */
    .bg-base {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 3. 背景の真上にコンテンツを重ねる */
    .content-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%; /* コンテンツも100%幅 */
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: normal;
      padding-top: 5vw; /* 上の隙間を画面幅に応じて調整 */
    }

    /* タイトルロゴ */
    .header {
      width: 90%; /* 画面幅の90%まで広げる */
      height: auto;
      margin-bottom: 5vw;
    }

    /* メニューボタン */
    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 85%; /* メニューも画面幅いっぱいに近く */
      margin-bottom: 8vw;
    }
    .btn { width: 100%; height: auto; cursor: pointer; }

    /* カウンター窓 */
    .counter-window {
      position: relative;
      width: 75%;
    }
    .window-bg { width: 100%; height: auto; }
    .window-content {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      color: #333;
      text-align: center;
    }

    /* ポップアップ（プロフィール等） */
    .popup {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); display: none;
      justify-content: center; align-items: center; z-index: 1000;
    }
    .popup-content { position: relative; width: 90%; max-width: 400px; }

    /* BLOG画面 */
    #blog {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 100; display: none; overflow-y: auto;
    }
    .diary-wrapper { width: 100%; }
    #diaryImage { width: 100%; height: auto; }
  </style>
</head>
<body>

  <div class="site-wrapper">
    <img src="img/background.png" class="bg-base">

    <div class="content-overlay" id="top">
      
      <img src="img/toppage.png" class="header">
      
      <div class="menu">
        <img src="img/Introduction.png" class="btn" onclick="showIntro()">
        <img src="img/GAME.png" class="btn" onclick="openComing()">
        <img src="img/Blog.png" class="btn" onclick="showBlog()">
        <img src="img/PROFILE.png" class="btn" onclick="openProfile()">
      </div>

      <div class="counter-window">
        <img src="img/window.png" class="window-bg">
        <div class="window-content">
          <p style="margin: 0; font-size: min(3.5vw, 14px); font-weight: bold;">あなたは</p>
          <div style="margin: 2% 0;">
            <script language="javascript" src="//counter1.fc2.com/counter.php?id=41003714&main=1"></script>
          </div>
          <p style="margin: 0; font-size: min(3.5vw, 14px); font-weight: bold;">人目の迷い子です</p>
        </div>
      </div>

    </div>
  </div>

  <script>
    function showBlog() { document.getElementById("blog").style.display = "block"; }
    function backToTop() { document.getElementById("blog").style.display = "none"; }
    function openProfile() { /* プロフィール表示処理 */ }
    function openComing() { alert("Coming Soon..."); }
    function showIntro() { alert("Introduction..."); }
  </script>

</body>
</html>
