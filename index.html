<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天使を育てることになりました｜少女育成ゲーム公式サイト</title>
    <meta name="description" content="少女育成シミュレーションゲーム『天使を育てることになりました』の公式サイトです。">

    <style>
        /* 1. 背景画像の設定（ここに画像を指定します） */
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            /* 背景画像を指定 */
            background-image: url('img/background.png'); 
            background-size: cover;      /* 画面いっぱいに広げる */
            background-position: center; /* 中央に合わせる */
            background-attachment: fixed; /* スクロールしても背景を動かさない */
            background-color: #9253c8;   /* 画像がない時の予備色 */
            text-align: center;
        }

        #top {
            padding: 20px 10px;
        }

        .header {
            width: 100%;
            max-width: 500px;
            height: auto;
            margin-bottom: 10px;
        }

        /* 2. ボタンを2列ずつ並べる */
        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            max-width: 350px;
            margin: 0 auto;
            padding: 10px;
        }

        .btn {
            width: 100%;
            height: auto;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* 3. カウンターの窓を整える */
        .counter-window {
            position: relative;
            width: 260px;
            margin: 30px auto;
        }
        .window-bg {
            width: 100%;
            height: auto;
            display: block;
        }
        .window-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            color: #333;
            font-family: sans-serif;
            font-weight: bold;
        }
        .counter-text { margin: 0; font-size: 13px; }
        .counter-line { margin: 2px 0; display: flex; justify-content: center; align-items: center; }
    </style>
</head>

<body>
  <div id="top">
    <img src="img/toppage.png" class="header">
    
    <div class="menu">
      <img src="img/Introduction.png" class="btn" onclick="showIntro()">
      <img src="img/GAME.png" class="btn" onclick="openComing()">
      <img src="img/Blog.png" class="btn" onclick="showBlog()">
      <img src="img/PROFILE.png" class="btn" onclick="openProfile()">
    </div>

    <div class="counter-window">
      <img src="img/window.png" class="window-bg">
      <div class="window-content">
        <p class="counter-text">あなたは</p>
        <div class="counter-line">
          <script language="javascript" type="text/javascript" src="//counter1.fc2.com/counter.php?id=41003714&main=1"></script>
        </div>
        <p class="counter-text">人目の迷い子です</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
