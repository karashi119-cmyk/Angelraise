<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>天使を育てることになりました｜少女育成ゲーム公式サイト</title>
    <meta name="description" content="少女育成シミュレーションゲーム『天使を育てることになりました』の公式サイトです。">

    <style>
        /* 画面全体のデザイン */
        body {
            margin: 0;
            padding: 0;
            background-color: #9253c8; /* 背景を紫に */
            text-align: center;
        }

        /* ヘッダー画像 */
        .header {
            width: 100%;
            max-width: 600px; /* 大きすぎないように制限 */
            height: auto;
        }

        /* メニューボタン */
        .menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .btn {
            width: 80%;
            max-width: 300px;
            cursor: pointer;
        }

        /* カウンターの窓 */
        .counter-window {
            position: relative;
            width: 280px; /* 窓の横幅 */
            margin: 30px auto; /* 真ん中に寄せる */
        }
        .window-bg {
            width: 100%;
            height: auto;
        }

        /* 窓の中の文字とカウンター */
        .window-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            color: #333;
            font-family: sans-serif;
            font-weight: bold;
        }
        .counter-text { margin: 0; font-size: 14px; }
        .counter-line { margin: 5px 0; }
        
        /* ポップアップなどの設定（念のため） */
        .popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; }
    </style>
</head>

<body>
  <div id="top">
    <img src="img/toppage.png" class="header">
    
    <div class="menu">
      <img src="img/Introduction.png" class="btn" onclick="showIntro()">
      <img src="img/GAME.png" class="btn" onclick="openComing()">
      <img src="img/Blog.png" class="btn" onclick="showBlog()">
      <img src="img/PROFILE.png" class="btn" onclick="openProfile()">
    </div>

    <div class="counter-window">
      <img src="img/window.png" class="window-bg">
      <div class="window-content">
        <p class="counter-text">あなたは</p>
        <div class="counter-line">
          <script language="javascript" type="text/javascript" src="//counter1.fc2.com/counter.php?id=41003714&main=1"></script>
        </div>
        <p class="counter-text">人目の迷い子です</p>
      </div>
    </div>
  </div>

  <div id="intro" style="display:none;">
    <img src="img/INTRO.png" style="width:100%;">
    <button onclick="backToTop()">TOP</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
