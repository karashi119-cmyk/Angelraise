<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>天使を育てることになりました。</title>
  <meta name="description" content="少女を育成するシミュレーションゲーム">

  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <style>
    /* 1. 画面全体の余白を完全にゼロにする */
    body, html {
      margin: 0; padding: 0;
      width: 100%; min-height: 100vh;
      background-color: #9253c8;
      font-family: 'DotGothic16', sans-serif;
      overflow-x: hidden;
    }

    /* 2. 背景画像を基準にする枠 */
    .site-wrapper {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    /* 土台の背景画像 */
    .bg-base {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 3. 背景の真上にコンテンツを重ねる */
    .content-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: normal;
      padding-top: 5vw;
    }

    .header { width: 90%; height: auto; margin-bottom: 5vw; }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 85%;
      margin-bottom: 8vw;
    }
    .btn { width: 100%; height: auto; cursor: pointer; transition: transform 0.1s; }
    .btn:active { transform: scale(0.95); }

    /* カウンター窓 */
    .counter-window {
      position: relative;
      width: 75%;
    }
    .window-bg { width: 100%; height: auto; }
    .window-content {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 100%; color: #333; text-align: center;
    }

    /* --- ポップアップ共通デザイン --- */
    .popup {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: none; /* 初期は非表示 */
      justify-content: center; align-items: center;
      z-index: 1000;
    }
    .popup-content {
      position: relative;
      width: 85%; max-width: 400px;
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      line-height: normal;
    }
    .close-btn {
      position: absolute; top: -45px; right: 0;
      font-size: 40px; color: white; cursor: pointer;
    }

    /* --- 日記・イントロ画面（全画面） --- */
    .full-page {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      z-index: 500;
      display: none;
      overflow-y: auto;
      text-align: center;
    }
    .page-wrapper { position: relative; width: 100%; line-height: 0; }
    .page-img { width: 100%; height: auto; }
    .arrow {
      position: absolute; bottom: 10%;
      width: 15%; max-width: 70px;
      opacity: 0.7; cursor: pointer;
    }

    .back-to-top {
      display: inline-block;
      margin: 30px 0; padding: 12px 25px;
      background: white; color: #9253c8;
      border: 4px solid #9253c8; border-radius: 8px;
      font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="site-wrapper">
    <img src="img/background.png" class="bg-base">

    <div class="content-overlay" id="top">
      <img src="img/toppage.png" class="header">
      
      <div class="menu">
        <img src="img/Introduction.png" class="btn" onclick="showIntro()">
        <img src="img/GAME.png" class="btn" onclick="openComing()">
        <img src="img/Blog.png" class="btn" onclick="showBlog()">
        <img src="img/PROFILE.png" class="btn" onclick="openProfile()">
      </div>

      <div class="counter-window">
        <img src="img/window.png" class="window-bg">
 <div class="window-content">
  <p style="margin: 0; font-size: clamp(16px, 2.5vw, 32px); font-weight: bold;">あなたは</p>
  
  <div id="fc2_counter_area" style="margin: 8px 0; transform: scale(1.5); transform-origin: center;">
    <script language="javascript" src="//counter1.fc2.com/counter.php?id=41003714&main=1"></script>
  </div>
  
  <p style="margin: 0; font-size: clamp(16px, 2.5vw, 32px); font-weight: bold;">人目の迷い子です</p>
</div>



  <div id="introPage" class="full-page">
    <div class="page-wrapper">
      <img src="img/INTRO.png" class="page-img">
      <div class="back-to-top" onclick="closeFullPage()">◀ TOPへ戻る</div>
    </div>
  </div>

  <div id="blogPage" class="full-page">
    <div class="page-wrapper">
      <img id="diaryImage" src="img/diary1.png" class="page-img">
      <img src="img/BACK.png" class="arrow" style="left: 5%;" onclick="changeDiary(-1)">
      <img src="img/NEXT.png" class="arrow" style="right: 5%;" onclick="changeDiary(1)">
      <div class="back-to-top" onclick="closeFullPage()">◀ TOPへ戻る</div>
    </div>
  </div>

  <div id="profilePopup" class="popup" onclick="closePopups()">
    <div class="popup-content" onclick="event.stopPropagation()">
      <span class="close-btn" onclick="closePopups()">×</span>
      <img src="img/pinkprofile.png" style="width:100%; border-radius:10px; margin-bottom:15px;">
      <div style="display:flex; justify-content:center; gap:20px;">
        <a href="https://x.com/n_nekomata?s=21&t=UNfIEowMXanUYBRbJpNHYw" target="_blank"><img src="img/x.png" style="width:45px;"></a>
        <a href="https://www.instagram.com/n.nekomata?igsh=MXF2ZXNubWJwZXZ2eg%3D%3D&utm_source=qr" target="_blank"><img src="img/insta.png" style="width:45px;"></a>
        <a href="https://www.tiktok.com/@n_nekomata3?_r=1&_t=ZS-96HaGT3U2MP" target="_blank"><img src="img/tiktok.png" style="width:45px;"></a>
      </div>
      <p style="color:#666; font-size:12px; margin-top:10px;">SNSも見てね！</p>
    </div>
  </div>

  <div id="comingPopup" class="popup" onclick="closePopups()">
    <div class="popup-content" onclick="event.stopPropagation()" style="background:none;">
      <span class="close-btn" onclick="closePopups()">×</span>
      <img src="img/comingsoon.png" style="width:100%; height:auto;">
    </div>
  </div>

  <script>
    // 画面表示・非表示の制御
    function showIntro() { document.getElementById("introPage").style.display = "block"; window.scrollTo(0,0); }
    function showBlog() { document.getElementById("blogPage").style.display = "block"; window.scrollTo(0,0); }
    function closeFullPage() { 
      document.getElementById("introPage").style.display = "none"; 
      document.getElementById("blogPage").style.display = "none"; 
    }

    function openProfile() { document.getElementById("profilePopup").style.display = "flex"; }
    function openComing() { document.getElementById("comingPopup").style.display = "flex"; }
    function closePopups() {
      document.getElementById("profilePopup").style.display = "none";
      document.getElementById("comingPopup").style.display = "none";
    }

    // 日記の切り替えロジック
    let currentDiary = 1;
    const totalDiaries = 3; // 日記の総数に合わせて変更してください
    function changeDiary(step) {
      currentDiary += step;
      if(currentDiary < 1) currentDiary = totalDiaries;
      if(currentDiary > totalDiaries) currentDiary = 1;
      document.getElementById("diaryImage").src = `img/diary${currentDiary}.png`;
      window.scrollTo(0,0);
    }
  </script>

</body>
</html>
