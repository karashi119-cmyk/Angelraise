<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>天使を育てることになりました。</title>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <style>
    /* --- 画面全体の設定 --- */
    body, html {
      margin: 0; padding: 0;
      width: 100%; min-height: 100vh;
      background-color: #e0d0ff; /* 外側の余白の色 */
      font-family: 'DotGothic16', sans-serif;
      display: flex;
      justify-content: center; /* 常に中央に配置 */
    }

    /* --- コンテンツ全体の枠（ここで背景と幅を固定） --- */
    .main-container {
      width: 90%; 
      max-width: 500px; /* ヘッダーと同じ幅に制限 */
      min-height: 100vh;
      background-image: url('img/background.png');
      background-size: 100% auto; /* 横幅いっぱいに広げて比率維持 */
      background-repeat: no-repeat;
      background-position: center top;
      background-color: #9253c8; /* 画像が切れた後の背景色 */
      position: relative;
      text-align: center;
    }

    /* --- 各要素の調整 --- */
    #top { width: 100%; padding-top: 20px; }
    .header { width: 100%; height: auto; margin-bottom: 20px; } /* 枠いっぱいに広げる */

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 90%;
      margin: 0 auto 30px auto;
    }
    .btn { width: 100%; height: auto; cursor: pointer; }

    /* カウンター */
    .counter-window {
      position: relative;
      width: 280px;
      margin: 20px auto;
    }
    .window-bg { width: 100%; height: auto; }
    .window-content {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 100%; color: #333;
    }

    /* BLOG画面 */
    #blog { display: none; width: 100%; background: #000; }
    .diary-wrapper { position: relative; width: 100%; }
    #diaryImage { width: 100%; height: auto; }
    .arrow { position: absolute; bottom: 10%; width: 15%; opacity: 0.7; }
  </style>
</head>
<body>

  <div class="main-container">

    <div id="top">
      <img src="img/toppage.png" class="header">
      
      <div class="menu">
        <img src="img/Introduction.png" class="btn" onclick="showIntro()">
        <img src="img/GAME.png" class="btn" onclick="openComing()">
        <img src="img/Blog.png" class="btn" onclick="showBlog()">
        <img src="img/PROFILE.png" class="btn" onclick="openProfile()">
      </div>

      <div class="counter-window">
        <img src="img/window.png" class="window-bg">
        <div class="window-content">
          <p style="margin: 0; font-size: 13px;">あなたは</p>
          <div style="margin: 5px 0;">
            <script language="javascript" src="//counter1.fc2.com/counter.php?id=41003714&main=1"></script>
          </div>
          <p style="margin: 0; font-size: 13px;">人目の迷い子です</p>
        </div>
      </div>
    </div>

    <div id="blog">
      <div class="diary-wrapper">
        <img id="diaryImage" src="img/diary1.png">
        <img src="img/BACK.png" class="arrow" style="left: 5%;">
        <img src="img/NEXT.png" class="arrow" style="right: 5%;">
      </div>
      <button onclick="backToTop()" style="margin: 20px;">TOPへ戻る</button>
    </div>

  </div> <script>
    function resetScreens() {
      document.getElementById("top").style.display = "none";
      document.getElementById("blog").style.display = "none";
    }
    function showBlog() { resetScreens(); document.getElementById("blog").style.display = "block"; }
    function backToTop() { resetScreens(); document.getElementById("top").style.display = "block"; }
    // プロフィール等の関数は以前のまま追加してください
  </script>
</body>
</html>
